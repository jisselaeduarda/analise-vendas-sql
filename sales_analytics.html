}
header {

}

.cards {

    gap: 18px; margin-bottom: 24px;
}
.card, .chart {
    background: white; padding: 22px;
    border-radius: 14px; box-shadow: 0 3px 14px #2020400c;
}
.card span { color: #6b6c80; font-size: 13px; }
.card h2 { margin: 12px 0 0; font-size: 27px; }
.charts {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
}
footer { color: #77788a; text-align: center; padding: 28px 0; }
@media (max-width: 750px) {
    body { padding: 14px; }
    .cards, .charts { grid-template-columns: 1fr; }
}
</style>
